DOCUMENTATION:
  module: page_order
  short_description: Configures default document order in IIS
  version_added: '1.2.1'
  description:
    - Adds or modifies the default document order in IIS.
  options:
    site:
      description:
        - The name of the IIS site to configure, for example V(Default Web Site).
        - The module resolves the site to the underlying IIS configuration path automatically.
      type: str
      required: true
    application:
      description:
        - The name of an application or virtual directory under O(site) to configure.
        - When omitted the configuration is applied at the site root.
      type: str
      required: false
    page_order:
      description:
        - The ordered list of default document names.
        - The first entry is served first when a request does not specify a document.
      type: list
      elements: str
      required: true
  extends_documentation_fragment:
    - ansible.builtin.action_common_attributes
  attributes:
    check_mode:
      support: full
    diff_mode:
      support: full
    platform:
      platforms:
        - windows
  seealso:
    - module: microsoft.iis.website
  author:
    - Justin Cook (@ch0nx)

EXAMPLES: |
  - name: Configure default document order for a site
    microsoft.iis.page_order:
      site: Default Web Site
      page_order:
        - default.aspx
        - Default.htm
        - Default.asp

  - name: Configure default document order for an application under a site
    microsoft.iis.page_order:
      site: Default Web Site
      application: MyApp
      page_order:
        - default.aspx
        - Default.htm

RETURN:
  target:
    description:
      - The resolved IIS configuration path the default document order was applied to.
    returned: always
    type: str
    sample: IIS:\Sites\Default Web Site
